<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexusChat Ultimate OS</title>
    <style>
        :root { 
            --bg-main: #0b141a; --bg-panel: #202c33; --bg-input: #2a3942; --text-main: #e9edef; --text-muted: #8696a0;
            --accent: #00a884; --accent-hover: #006653; --admin: #ff4757; --elite: #ffa502; --user: #2ed573;
            --system: #34b7f1; --msg-own: #005c4b; --msg-other: #202c33; --danger: #eb4d4b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .hidden { display: none !important; }

        .auth-wrapper { background: var(--bg-panel); width: 100%; max-width: 440px; padding: 40px; border-radius: 16px; box-shadow: 0 15px 50px rgba(0,0,0,0.7); margin: 15px; text-align: center; }
        .auth-brand h2 { color: var(--accent); font-size: 2rem; font-weight: 800; margin-bottom: 25px; }
        .auth-input-group { margin-bottom: 18px; }
        .auth-input-group input { width: 100%; padding: 16px; border-radius: 12px; background: var(--bg-input); color: white; border: none; outline: none; font-size: 1rem; }
        .auth-btn { width: 100%; padding: 16px; background: var(--accent); color: #111b21; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
        .auth-switch { text-align: center; margin-top: 22px; color: var(--system); cursor: pointer; }

        .app-shell { display: flex; width: 100vw; height: 100vh; position: relative; }
        .sidebar { width: 340px; background: #111b21; border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; }
        .sidebar-my-profile { padding: 18px; background: var(--bg-panel); display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--bg-input); }
        .profile-meta-row { display: flex; align-items: center; justify-content: space-between; }
        .status-updater { display: flex; gap: 8px; }
        .status-updater input { flex: 1; padding: 8px 12px; border-radius: 20px; background: var(--bg-input); color: white; border: none; outline: none; font-size: 0.85rem; }
        .status-updater button { padding: 6px 12px; background: var(--accent); border: none; border-radius: 20px; font-weight: bold; cursor: pointer; color: #111b21; }

        .list-section-title { padding: 14px 18px; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; background: rgba(0,0,0,0.15); }
        .user-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
        .user-card { padding: 14px 16px; background: rgba(255,255,255,0.02); border-radius: 10px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .user-card-top { display: flex; justify-content: space-between; align-items: center; }
        .user-card-status { font-size: 0.8rem; color: var(--text-muted); }

        .chat-view { flex: 1; display: flex; flex-direction: column; background: #0b141a; position: relative; }
        .chat-bar { background: var(--bg-panel); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); }
        #typingIndicator { font-size: 0.8rem; color: var(--accent); font-weight: 500; }

        .message-stream { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
        .msg-bubble { display: flex; flex-direction: column; max-width: 70%; width: fit-content; padding: 12px 16px; border-radius: 14px; background: var(--msg-other); position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .msg-node-own { background: var(--msg-own); align-self: flex-end; }
        .msg-header-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; font-weight: bold; }
        .msg-footer-row { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 4px; }
        .msg-time-stamp { font-size: 0.7rem; color: var(--text-muted); }
        .delete-msg-btn { background: none; border: none; color: var(--danger); font-size: 0.75rem; cursor: pointer; margin-left: 5px; }

        .badge { padding: 3px 8px; border-radius: 5px; font-size: 0.65rem; font-weight: 900; text-transform: uppercase; color: #111b21; }
        .badge-admin { background: var(--admin); color: white; }
        .badge-elite { background: var(--elite); }
        .badge-user { background: var(--user); }

        .input-bar { display: flex; padding: 14px 20px; background: var(--bg-panel); gap: 14px; align-items: center; }
        .input-bar input { flex: 1; padding: 16px; border: none; border-radius: 28px; background: var(--bg-input); color: white; outline: none; font-size: 1rem; padding-left: 24px; }
        .input-bar button { width: 52px; height: 52px; background: var(--accent); border: none; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .input-bar button svg { width: 24px; height: 24px; fill: #111b21; }

        .control-popup { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .popup-card { background: var(--bg-panel); padding: 30px; border-radius: 16px; width: 92%; max-width: 340px; text-align: center; }
        .popup-card button { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .p-btn-elite { background: var(--elite); color: black; }
        .p-btn-unelite { background: #dcdde1; color: black; }
        .p-btn-ban { background: var(--admin); color: white; }
        .p-btn-cancel { background: #718093; color: white; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; top: 0; left: -100%; height: 100%; width: 300px; z-index: 50; }
        }
    </style>
</head>
<body>
    <div id="sidebarOverlay" class="sidebar-overlay hidden" onclick="toggleMobileSidebar()"></div>

    <!-- Giriş ve Kayıt Arayüz Bölümü -->
    <div id="authPlaceholder">
        <div id="authPanel" class="auth-wrapper">
            <div class="auth-brand">
                <h2>NexusChat Ultimate</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: -15px; margin-bottom: 20px;">Güvenli İletişim Portalı</p>
            </div>
            <div class="auth-input-group" id="regNameGroup" style="display:none;"><input type="text" id="authScreenName" placeholder="Görünür İsim"></div>
            <div class="auth-input-group"><input type="email" id="authMailField" placeholder="E-posta"></div>
            <div class="auth-input-group"><input type="password" id="authPassField" placeholder="Şifre"></div>
            <button class="auth-btn" id="executeAuthBtn">Giriş Yetkisi Al</button>
            <p class="auth-switch" id="switchAuthModeBtn">Hesabın yok mu? Yeni Kayıt Aç</p>
        </div>
    </div>

    <!-- Ana Yazılım Mesajlaşma Arayüz Bölümü -->
    <div id="appPlaceholder">
        <div id="appShell" class="app-shell hidden">
            <aside class="sidebar" id="sidebarNode">
                <div class="sidebar-my-profile">
                    <div class="profile-meta-row">
                        <div class="profile-text">
                            <span class="my-name" id="myAccountName">Yükleniyor...</span>
                            <div><span id="myAccountBadge"></span></div>
                        </div>
                        <button id="exitBtn" style="background:none; border:1px solid var(--admin); color:var(--admin); padding:5px 10px; border-radius:6px; font-size:0.8rem; font-weight:bold; cursor:pointer;">Çıkış</button>
                    </div>
                    <div class="status-updater">
                        <input type="text" id="myStatusInput" placeholder="Durumunu paylaş..." maxlength="40">
                        <button id="statusBtn">Paylaş</button>
                    </div>
                </div>
                <div class="list-section-title">Canlı Üyeler</div>
                <div class="user-list" id="activeUsersContainer"></div>
            </aside>
            <main class="chat-view">
                <header class="chat-bar">
                    <div>
                        <div style="font-weight:bold; font-size:1.15rem;">🌐 Ana Güvenlik Kanalı</div>
                        <div id="typingIndicator"></div>
                    </div>
                </header>
                <div class="message-stream" id="messageStreamContainer"></div>
                <footer class="input-bar">
                    <input type="text" id="chatMessageInputField" placeholder="Mesaj gönder..." autocomplete="off">
                    <button id="sendBtn"><svg viewBox="0 0 24 24"><path d="M2 .5L23 12 2 23.5v-9l14-2.5-14-2.5z"/></svg></button>
                </footer>
            </main>
        </div>
    </div>

    <!-- Admin Kontrol Bölümü -->
    <div id="modalPlaceholder">
        <div id="adminPanelModal" class="control-popup hidden">
            <div class="popup-card">
                <h3 id="targetUserTitle">Yönetim</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px;">Operasyon seçin.</p>
                <button class="p-btn-elite" id="actionEliteBtn">Elit Yap</button>
                <button class="p-btn-unelite" id="actionUneliteBtn">Elitlik Al</button>
                <button class="p-btn-ban" id="actionBanBtn">Sistemden Banla</button>
                <button class="p-btn-cancel" id="closeModalBtn">İptal</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, update, set, push, onValue, onChildAdded, remove, get } from "https://gstatic.com";

        // Firebase Altyapı Bağlantısı
        const firebaseConfig = {
            apiKey: "AIzaSyBHM4BtiuEcGSEMhANG-oSJcuK1KKaVzdg",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebasedatabase.app",
            projectId: "nexuschat-8f0f7",
            storageBucket: "nexuschat-8f0f7.firebasestorage.app",
            messagingSenderId: "457648292524",
            appId: "1:457648292524:web:68db7c988d591fe9f81509"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let session = null;
        let regFlow = false;
        let selectedUid = null;
        let typingTimeout = null;

        // Siber Koruma XSS Filtresi
        function XSSDefenceFilter(payload) {
            if (!payload) return "";
            return payload.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#x27;").replace(/\//g, "&#x2F;");
        }

        // Giriş ve Kayıt Ekranı Değiştirici
        document.getElementById('switchAuthModeBtn').onclick = function() {
            regFlow = !regFlow;
            document.getElementById('regNameGroup').style.display = regFlow ? 'block' : 'none';
            document.getElementById('switchAuthModeBtn').innerText = regFlow ? "Hesabınız var mı? Giriş Yapın" : "Hesabın yok mu? Yeni Kayıt Aç";
        };
        // Yetki ve Kimlik Kontrol Noktası
        document.getElementById('executeAuthBtn').onclick = async function() {
            const email = document.getElementById('authMailField').value.trim();
            const pass = document.getElementById('authPassField').value.trim();
            const name = document.getElementById('authScreenName').value.trim();

            if (!email || !pass || (regFlow && !name)) { alert("Boş alan bırakılamaz!"); return; }
            const cryptoUid = email.replace(/[^a-zA-Z0-9]/g, "_");

            try {
                if (regFlow) {
                    const userQuery = await get(ref(db, "kullanicilar/" + cryptoUid));
                    if (userQuery.exists()) { alert("Bu e-posta zaten kayıtlı!"); return; }

                    let role = "kullanici";
                    if (cryptoUid.toLowerCase().includes("admin") || cryptoUid.toLowerCase().includes("fortnite") || cryptoUid.toLowerCase().includes("cortexlink")) { role = "admin"; }

                    session = { uid: cryptoUid, ad: XSSDefenceFilter(name), email: email, passwordHash: btoa(pass), rol: role, status: "aktif", durumMesaji: "NexusChat kullanıyor" };
                    await set(ref(db, "kullanicilar/" + cryptoUid), session);
                } else {
                    const credentialQuery = await get(ref(db, "kullanicilar/" + cryptoUid));
                    if (!credentialQuery.exists() || credentialQuery.val().passwordHash !== btoa(pass)) { alert("Hatalı giriş!"); return; }
                    if (credentialQuery.val().status === "banli") { alert("Banlandınız!"); return; }
                    session = credentialQuery.val();
                }

                document.getElementById('authPanel').classList.add('hidden');
                document.getElementById('appShell').classList.remove('hidden');
                sistemiBaslat();

            } catch(e) { alert(e.message); }
        };

        // Realtime Canlı Veri Akış Yönetimi
        function sistemiBaslat() {
            document.getElementById('myAccountName').innerText = session.ad;
            updateBadgeUI(session.rol);

            // Durum Paylaşma Butonu
            document.getElementById('statusBtn').onclick = function() {
                const txt = document.getElementById('myStatusInput').value.trim();
                set(ref(db, "kullanicilar/" + session.uid + "/durumMesaji"), XSSDefenceFilter(txt) || "Mevcut");
                alert("Durum güncellendi!");
            };

            // Canlı Sunucu Ban Kontrolü
            onValue(ref(db, "kullanicilar/" + session.uid + "/status"), (snapshot) => {
                if (snapshot.val() === "banli") { alert("Banlandınız!"); window.location.reload(); }
            });

            // "Yazıyor..." Sinyali Gönderme
            document.getElementById('chatMessageInputField').oninput = function() {
                set(ref(db, "yaziyor/" + session.uid), { ad: session.ad, durum: true });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => { set(ref(db, "yaziyor/" + session.uid), { durum: false }); }, 2000);
            };
            // Karşı Taraf Yazıyor Bilgisi Dinleme
            onValue(ref(db, 'yaziyor'), (snapshot) => {
                const indicator = document.getElementById('typingIndicator');
                let typingUsers = [];
                snapshot.forEach((child) => {
                    const data = child.val();
                    if (data.durum && child.key !== session.uid) { typingUsers.push(data.ad); }
                });
                indicator.innerText = typingUsers.length > 0 ? typingUsers.join(', ') + " yazıyor..." : "";
            });

            // Üye Kartlarını Listeleme ve Tıklama Yakalayıcı
            onValue(ref(db, 'kullanicilar'), (snapshot) => {
                const listContainer = document.getElementById('activeUsersContainer');
                listContainer.innerHTML = '';
                snapshot.forEach((child) => {
                    const node = child.val();
                    if (node.status !== "banli") {
                        const card = document.createElement('div');
                        card.className = 'user-card';
                        card.innerHTML = "<div class='user-card-top'><strong>" + node.ad + "</strong><span class='badge badge-" + node.rol + "'>" + node.rol + "</span></div><div class='user-card-status'>" + (node.durumMesaji || 'NexusChat kullanıyor') + "</div>";
                        card.onclick = () => {
                            if (session.rol === "admin" && node.uid !== session.uid) {
                                selectedUid = node.uid;
                                document.getElementById('targetUserTitle').innerText = node.ad;
                                document.getElementById('adminPanelModal').classList.remove('hidden');
                            }
                        };
                        listContainer.appendChild(card);
                    }
                });
            });

            // WhatsApp Tarzı Mesaj Akışı ve Silme Buton Bağlayıcı
            const streamContainer = document.getElementById('messageStreamContainer');
            onValue(ref(db, 'mesajlar'), (snapshot) => {
                streamContainer.innerHTML = '';
                snapshot.forEach((child) => {
                    const dataPack = child.val();
                    const msgId = child.key;
                    const bubble = document.createElement('div');
                    bubble.className = dataPack.uid === session.uid ? 'msg-bubble msg-node-own' : 'msg-bubble';
                    
                    let deleteButton = '';
                    if (dataPack.uid === session.uid || session.rol === 'admin') {
                        deleteButton = "<button class='delete-msg-btn' data-id='" + msgId + "'>🗑️</button>";
                    }

                    bubble.innerHTML = "<div class='msg-header-row'><span>" + dataPack.kullanici + "</span><span class='badge badge-" + dataPack.rol + "'>" + dataPack.rol + "</span></div><div class='msg-body-text'>" + dataPack.metin + "</div><div class='msg-footer-row'><span class='msg-time-stamp'>" + (dataPack.saat || '12:00') + "</span>" + deleteButton + "</div>";
                    streamContainer.appendChild(bubble);
                });
                streamContainer.scrollTop = streamContainer.scrollHeight;

                document.querySelectorAll('.delete-msg-btn').forEach(btn => {
                    btn.onclick = (e) => { remove(ref(db, "mesajlar/" + e.target.getAttribute('data-id'))); };
                });
            });
        }

        // Mesaj Gönderme Tetikleyici Butonu
        document.getElementById('sendBtn').onclick = function() {
            const inputField = document.getElementById('chatMessageInputField');
            if (inputField.value.trim() !== "") {
                const clock = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                push(ref(db, 'mesajlar'), { uid: session.uid, kullanici: session.ad, metin: XSSDefenceFilter(inputField.value), rol: session.rol, saat: clock });
                set(ref(db, "yaziyor/" + session.uid), { durum: false });
                inputField.value = '';
            }
        };

        document.getElementById('exitBtn').onclick = () => window.location.reload();
        const closeM = () => document.getElementById('adminPanelModal').classList.add('hidden');
        document.getElementById('closeModalBtn').onclick = closeM;

        // Admin Operasyon Buton Emirleri (Hatasız Klasik JavaScript Bağlaçları)
        document.getElementById('actionEliteBtn').onclick = function() { if(selectedUid) { update(ref(db, "kullanicilar/" + selectedUid), { rol: "elite" }); closeM(); } };
        document.getElementById('actionUneliteBtn').onclick = function() { if(selectedUid) { update(ref(db, "kullanicilar/" + selectedUid), { rol: "kullanici" }); closeM(); } };
        document.getElementById('actionBanBtn').onclick = function() { if(selectedUid) { update(ref(db, "kullanicilar/" + selectedUid), { status: "banli" }); closeM(); } };

        document.getElementById('chatMessageInputField').onkeypress = (e) => { if(e.keyCode===13) document.getElementById('sendBtn').click(); };

        function updateBadgeUI(role) {
            const myBadge = document.getElementById('myAccountBadge');
            myBadge.className = "badge badge-" + role;
            myBadge.innerText = role === "admin" ? "Admin" : (role === "elite" ? "Elit" : "Üye");
        }
    </script>
</body>
</html>
